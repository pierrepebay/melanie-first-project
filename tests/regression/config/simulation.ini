# Configuration for the intern diffusion playground.
# Change one value at a time, rerun, and compare the logs and VTK files.

case_name = melanie_demo
output_dir = output

# Grid size. Larger grids produce larger CSV and VTK files.
nx = 25
ny = 17

# Time stepping. The code writes a snapshot at step 0, every output_every
# steps, and the final step.
steps = 120
output_every = 6

# Diffusion parameters.
# The explicit update is stable when alpha * dt / dx^2 <= 0.25.
alpha = 0.1
dt = 1.0
dx = 1.0

# Initial hot spot strength.
source_strength = 100

# Ambient temperature
t_amb = 25.0