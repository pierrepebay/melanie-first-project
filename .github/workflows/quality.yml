name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check whitespace
        run: scripts/check-whitespace.sh

      - name: Check branch name
        if: github.event_name == 'pull_request'
        run: scripts/check-branch-name.sh "${{ github.head_ref }}"

      - name: Check commit messages
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --depth=50
            scripts/check-commit-message.sh --range "origin/${{ github.base_ref }}..HEAD"
          else
            scripts/check-commit-message.sh "$(git log -1 --format=%s)"
          fi
